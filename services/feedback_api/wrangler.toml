name = "long-ky-feedback-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Served at https://long-ky-feedback-api.<your-subdomain>.workers.dev — a custom
# domain would need long-ky.com's DNS on Cloudflare, which it isn't (Squarespace).

# Per-IP: 5 reports a minute. Optional in code, so removing it is safe.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# Plain config, not secrets. RESEND_API_KEY is the one real secret:
#   wrangler secret put RESEND_API_KEY
[vars]
FEEDBACK_FROM = "admin@long-ky.com"
FEEDBACK_TO = "help@long-ky.com"
