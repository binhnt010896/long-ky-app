name: admin
description: Long Ký CMS — internal admin tool for editing era/people/period content and publishing.
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Workspace packages — reuses the exact canonical-format/validation code
  # the CLI and CI use, never a reimplementation.
  core_domain:
    path: ../../packages/core_domain

  # State + navigation (same stack as apps/mobile).
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Auth: Google sign-in via Firebase Auth's own popup flow (web only —
  # this app never ships to mobile/desktop).
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3

  # Talks to the Cloudflare Worker (services/cms_api) over plain HTTP —
  # never touches GitHub or R2 directly.
  http: ^1.6.0
  # Selects a local file to upload as a media original (web file picker).
  file_picker: ^8.1.6
  mime: ^2.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
