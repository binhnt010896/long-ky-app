name: viet_su
description: Việt Sử — immersive Vietnamese history (flagship app, all eras).
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Workspace packages.
  ui_kit:
    path: ../../packages/ui_kit
  core_domain:
    path: ../../packages/core_domain
  core_content:
    path: ../../packages/core_content
  experience:
    path: ../../packages/experience

  # State + navigation (per the project stack).
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  # Motion (timeline card entrances).
  flutter_animate: ^4.5.0
  # Audio for the "Chào cờ" flag-salute page (Tiến quân ca).
  just_audio: ^0.9.42
  # Looping video covers (e.g. the animated Điện Biên Phủ era cover).
  video_player: ^2.9.2
  # Era media (images/video) is served from R2, not bundled — these fetch and
  # cache it on device.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Generates the Android launcher icon (Long Ký seal) — run:
  #   dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# Long Ký launcher icon. The adaptive icon layers a padded, transparent
# foreground (the seal) over a solid oxblood background so it survives every
# Android mask; image_path is the legacy/round fallback for pre-Android-8.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/long-ky-logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4b0102"
  adaptive_icon_foreground: "assets/brand/long-ky-foreground.png"

flutter:
  uses-material-design: true
  assets:
    # Brand assets (Long Ký logo / seal).
    - assets/brand/
    # Canonical content lives at repo-root content/; assets/content is a
    # symlink to it. Era MEDIA (images/video) is served from the R2 CDN and
    # published with tool/sync_media.sh — see content_assets.dart — so only
    # JSON, the media manifest, brand and Chào cờ assets are bundled here.
    - assets/content/index.json
    - assets/content/people.json
    - assets/content/periods.json
    - assets/content/media-manifest.json
    - assets/content/eras/
    - assets/content/chao-co/
