name: viet_su_workspace
publish_to: none

# Root of the Việt Sử pub workspace (Dart pub workspaces + Melos).
# Member packages set `resolution: workspace` and are listed below so a single
# `dart pub get` resolves the whole monorepo against one lockfile.

environment:
  sdk: ^3.12.0

workspace:
  - packages/ui_kit
  - packages/core_domain
  - packages/core_content
  - packages/experience
  - apps/mobile
  - apps/admin

dev_dependencies:
  melos: ^6.3.0
  crypto: ^3.0.7
  # tool/validate_content.dart and tool/format_content.dart call into
  # ContentValidator/ContentFormatter (core_domain is pure Dart, so it runs
  # fine under plain `dart run`, unlike core_content which needs Flutter).
  core_domain:
    path: packages/core_domain
