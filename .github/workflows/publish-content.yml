name: publish-content

# Publishes content/ to R2, starting from `long-ky-sources` (the shared
# originals bucket) instead of whatever happens to be on one Mac's disk —
# so the CMS's Publish button and `gh workflow run publish-content` both
# publish from the same source of truth.
#
# Manual trigger only: publishing is never automatic. `dry_run: true`
# previews (formats, validates, converts media, reports what would change)
# without touching R2 or committing anything.
#
# `mode: incremental` (the default, Cycle K) only downloads/converts/uploads
# the media that actually changed since the last publish, using
# `content/media-sources.json` (a ledger of what's live) and a fast,
# metadata-only listing of long-ky-sources — no more re-pulling all 3.7 GB
# and re-encoding all ~650 images on every run. `mode: full` is the old
# unconditional pipeline: every original re-pulled, every image
# re-converted, a full `rclone sync --delete-excluded`. Use it to bootstrap
# the ledger, after an encoder-settings change, or if incremental ever
# looks wrong and a clean rebuild is worth the ~15-20 min.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — don't upload to R2 or commit"
        type: boolean
        default: false
      mode:
        description: "incremental (fast, only what changed) or full (rebuild everything)"
        type: choice
        options: [incremental, full]
        default: incremental
      expected_sha:
        description: "Optional — real publish fails if main has moved past this commit since the dry run that approved it"
        type: string
        default: ""

concurrency:
  group: publish-content
  cancel-in-progress: false

run-name: >-
  ${{ inputs.dry_run && 'dry run' || 'publish' }}
  (${{ inputs.mode }}) ${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to publish over a moved main
        if: ${{ !inputs.dry_run && inputs.expected_sha != '' && inputs.expected_sha != github.sha }}
        run: |
          echo "✗ main is at ${{ github.sha }}, but this publish was approved by a dry run of ${{ inputs.expected_sha }}."
          echo "  Content changed since that dry run — dry run again before publishing."
          exit 1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install a pinned rclone
        run: |
          curl -sL https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.deb -o /tmp/rclone.deb
          sudo dpkg -i /tmp/rclone.deb

      - name: Configure the r2 rclone remote
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          EOF

      - name: dart pub get (workspace)
        run: dart pub get

      # Same gate as content-check.yml — content must already be clean
      # before anyone tries to publish it.
      - name: Canonical content formatting
        run: dart run tool/format_content.dart --check

      - name: Content schema + referential-integrity validation
        run: dart run tool/validate_content.dart

      - name: core_domain tests (loads the full content corpus)
        working-directory: packages/core_domain
        run: flutter test

      # ---------------------------------------------------------------
      # mode: full — today's unconditional pipeline.
      # ---------------------------------------------------------------
      - name: "[full] Pull every original from long-ky-sources"
        if: ${{ inputs.mode == 'full' }}
        run: tool/pull_sources.sh

      - name: "[full] Install cwebp"
        if: ${{ inputs.mode == 'full' }}
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: "[full] Publish (dry run)"
        if: ${{ inputs.mode == 'full' && inputs.dry_run }}
        run: tool/publish_content.sh --dry-run

      - name: "[full] Publish"
        if: ${{ inputs.mode == 'full' && !inputs.dry_run }}
        run: tool/publish_content.sh

      - name: "[full] Refresh the media ledger"
        if: ${{ inputs.mode == 'full' && !inputs.dry_run }}
        run: dart run tool/write_media_ledger.dart

      # ---------------------------------------------------------------
      # mode: incremental — only what changed (Cycle K).
      # ---------------------------------------------------------------
      - name: "[incremental] Plan the publish (no downloads)"
        if: ${{ inputs.mode == 'incremental' }}
        run: dart run tool/media_ledger.dart --mode incremental

      - name: "[incremental] Job summary"
        if: ${{ inputs.mode == 'incremental' }}
        run: |
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat build/media-plan.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: "[incremental] Download only the changed originals"
        if: ${{ inputs.mode == 'incremental' }}
        run: |
          if grep -q '[^[:space:]]' build/media-changed-sources.txt; then
            rclone copy r2:long-ky-sources content/ \
              --files-from build/media-changed-sources.txt \
              --s3-no-check-bucket --progress
          else
            echo "✓ nothing changed — no originals to download."
          fi

      - name: "[incremental] Install cwebp"
        if: ${{ inputs.mode == 'incremental' }}
        run: |
          if grep -q '[^[:space:]]' build/media-changed-sources.txt; then
            sudo apt-get update && sudo apt-get install -y webp
          else
            echo "✓ nothing to convert — skipping cwebp install."
          fi

      - name: "[incremental] Convert only the changed media"
        if: ${{ inputs.mode == 'incremental' }}
        run: dart run tool/gen_media_manifest.dart --only build/media-changed-sources.txt

      - name: "[incremental] Upload the changed media"
        if: ${{ inputs.mode == 'incremental' && !inputs.dry_run }}
        run: tool/sync_media_changed.sh

      # Runs in both dry-run and real incremental publishes — mirrors the
      # full-mode dry-run/publish split (tool/publish_content.sh --dry-run)
      # so a dry run actually exercises the pack build + the media-manifest
      # staleness check (`--only`, so it needs only the changed originals a
      # CI runner actually downloaded, not all 646) instead of skipping it
      # entirely — the gap that let a stale-manifest failure reach a real
      # publish undetected once (see the incident note below).
      - name: "[incremental] Build the content pack"
        if: ${{ inputs.mode == 'incremental' }}
        run: dart run tool/build_content_pack.dart --only build/media-changed-sources.txt

      - name: "[incremental] Upload the content pack"
        if: ${{ inputs.mode == 'incremental' && !inputs.dry_run }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('build/pack/latest.json'))['version'])")
          rclone copyto "build/pack/${VERSION}.json" \
            "r2:long-ky-content/content/packs/${VERSION}.json" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --s3-no-check-bucket
          rclone copyto "build/pack/latest.json" \
            "r2:long-ky-content/content/latest.json" \
            --header-upload "Cache-Control: no-cache" \
            --s3-no-check-bucket
          echo "✓ published content pack ${VERSION}"

      # Deletions happen only after the new pack is live (decision K2) — a
      # phone still on the old pack must never see a missing image.
      - name: "[incremental] Remove media no longer referenced"
        if: ${{ inputs.mode == 'incremental' && !inputs.dry_run }}
        run: tool/delete_media.sh

      - name: "[incremental] Refresh the media ledger"
        if: ${{ inputs.mode == 'incremental' && !inputs.dry_run }}
        run: dart run tool/write_media_ledger.dart

      # Cycle K5 — era/people/periods text, live-readable by the app via
      # Firestore, on top of the R2 pack every app version can already read.
      # Runs for both modes: this reads content/*.json from the checkout
      # directly, nothing media-pipeline-specific. Skips itself cleanly (see
      # the script) if FIREBASE_SERVICE_ACCOUNT_KEY isn't set up yet.
      - name: Write era/people/periods text to Firestore
        if: ${{ !inputs.dry_run }}
        working-directory: tool
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node publish_firestore.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}

      # Every mode's real publish ends here — this runner has no one to
      # commit the resulting bump by hand, so it does that itself.
      - name: Commit the published version bump
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "long-ky-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/content-version.json content/media-manifest.json content/media-sources.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(content): publish content pack $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
